name: Cloudways Auto Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cloudways-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Cloudways Server
    runs-on: ubuntu-latest

    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.CLOUDWAYS_HOST }}
          username: ${{ secrets.CLOUDWAYS_USER }}
          key: ${{ secrets.CLOUDWAYS_SSH_KEY }}
          port: 22
          command_timeout: 20m
          script_stop: true
          script: |
            set -euo pipefail

            # The system Node is 18.17.1, too old for Next 15 to build.
            # Use the Node 20 nvm installed for this user, but do NOT source
            # nvm.sh - it auto-activates the default version and aborts on
            # this user's .npmrc prefix setting.
            NODE20_BIN="$(ls -d "$HOME"/.nvm/versions/node/v20*/bin 2>/dev/null | tail -1 || true)"
            if [ -n "$NODE20_BIN" ]; then
              export PATH="$NODE20_BIN:$PATH"
            fi

            # pm2 lives in the user's own npm prefix; append so node/npm
            # still resolve to the Node 20 install above.
            export PATH="$PATH:$HOME/.npm-global/bin"

            echo "node $(node -v) / npm $(npm -v)"

            APP_DIR="${{ vars.CLOUDWAYS_APP_PATH }}"
            REPO_URL="https://github.com/arrafbadreddine-lang/american-website.git"

            if [ -z "$APP_DIR" ]; then
              echo "ERROR: repository variable CLOUDWAYS_APP_PATH is not set."
              exit 1
            fi

            if [ ! -d "$APP_DIR" ]; then
              echo "ERROR: $APP_DIR does not exist on the server."
              exit 1
            fi

            cd "$APP_DIR"
            echo "Working directory: $(pwd)"

            # The app folder is owned by the application user, not by the
            # master user this deploy runs as, so git needs it whitelisted.
            git config --global --add safe.directory "$APP_DIR" || true
            git config --global --add safe.directory "$(pwd -P)" || true

            if [ ! -d .git ]; then
              echo "--- First run: bootstrapping git repository ---"
              git init
            fi

            git remote remove origin 2>/dev/null || true
            git remote add origin "$REPO_URL"

            echo "--- Pulling latest code ---"
            git fetch --depth=1 origin main
            git reset --hard origin/main

            echo "--- Installing dependencies ---"
            if [ -f package-lock.json ]; then
              npm ci --include=dev
            else
              npm install --include=dev
            fi

            echo "--- Building ---"
            npm run build

            echo "--- Restarting app ---"
            if command -v pm2 >/dev/null 2>&1; then
              pm2 restart forksavvy --update-env \
                || pm2 restart forksavvyrecipes --update-env \
                || pm2 start npm --name "forksavvy" -- run start
              pm2 save
              pm2 list
            else
              echo "ERROR: pm2 not found - the new build is NOT live."
              exit 1
            fi

            echo "Deployment finished."
