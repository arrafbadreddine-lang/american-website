name: Cloudways Auto Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy to Cloudways Server
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: SSH to Cloudways and Deploy
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.CLOUDWAYS_HOST }}
          username: ${{ secrets.CLOUDWAYS_USER }}
          key: ${{ secrets.CLOUDWAYS_SSH_KEY }}
          port: 22
          script: |
            echo "🚀 Starting Deployment on Cloudways..."
            
            # Find and enter the application public directory
            if [ -d "public_html" ]; then
              cd public_html
            elif [ -d "$HOME/public_html" ]; then
              cd "$HOME/public_html"
            elif [ -d "applications" ]; then
              cd applications/*/public_html
            fi
            
            echo "📂 Working directory: $(pwd)"
            
            # Pull latest changes
            git pull origin main
            
            # Install dependencies and build
            npm install --production=false
            npm run build
            
            # Restart or start PM2 process for Next.js (port 3001)
            if command -v pm2 &> /dev/null; then
              pm2 restart forksavvyrecipes || pm2 start npm --name "forksavvyrecipes" -- run start
              pm2 save
            fi
            
            echo "✅ Deployment completed successfully!"
