name: Cloudways Auto Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cloudways-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Cloudways Server
    runs-on: ubuntu-latest

    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.CLOUDWAYS_HOST }}
          username: ${{ secrets.CLOUDWAYS_USER }}
          key: ${{ secrets.CLOUDWAYS_SSH_KEY }}
          port: 22
          command_timeout: 20m
          script_stops: true
          script: |
            set -euo pipefail

            APP_DIR="${{ vars.CLOUDWAYS_APP_PATH }}"

            if [ -z "$APP_DIR" ]; then
              echo "ERROR: repository variable CLOUDWAYS_APP_PATH is not set."
              echo "Find the right path on the server with:"
              echo "  ls -d /home/master/applications/*/public_html"
              exit 1
            fi

            if [ ! -d "$APP_DIR" ]; then
              echo "ERROR: $APP_DIR does not exist on the server."
              exit 1
            fi

            cd "$APP_DIR"
            echo "Working directory: $(pwd)"

            if [ ! -d .git ]; then
              echo "ERROR: $APP_DIR is not a git repository."
              echo "Clone the repo there once before auto-deploy can work."
              exit 1
            fi

            echo "--- Pulling latest code ---"
            git fetch origin main
            git reset --hard origin/main

            echo "--- Installing dependencies ---"
            if [ -f package-lock.json ]; then
              npm ci --include=dev
            else
              npm install --include=dev
            fi

            echo "--- Building ---"
            npm run build

            echo "--- Restarting app ---"
            if command -v pm2 >/dev/null 2>&1; then
              pm2 restart forksavvyrecipes --update-env \
                || pm2 start npm --name forksavvyrecipes -- run start
              pm2 save
            else
              echo "WARNING: pm2 not found for this user - app was NOT restarted."
            fi

            echo "Deployment finished."
