name: Cloudways Auto Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cloudways-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Cloudways Server
    runs-on: ubuntu-latest

    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.CLOUDWAYS_HOST }}
          username: ${{ secrets.CLOUDWAYS_USER }}
          key: ${{ secrets.CLOUDWAYS_SSH_KEY }}
          port: 22
          command_timeout: 20m
          script_stop: true
          script: |
            set -euo pipefail

            # pm2 lives in the user's own npm prefix, which a
            # non-interactive SSH session does not pick up.
            export PATH="$HOME/.npm-global/bin:$PATH"

            APP_DIR="${{ vars.CLOUDWAYS_APP_PATH }}"
            REPO_URL="https://github.com/arrafbadreddine-lang/american-website.git"

            if [ -z "$APP_DIR" ]; then
              echo "ERROR: repository variable CLOUDWAYS_APP_PATH is not set."
              exit 1
            fi

            if [ ! -d "$APP_DIR" ]; then
              echo "ERROR: $APP_DIR does not exist on the server."
              exit 1
            fi

            cd "$APP_DIR"
            echo "Working directory: $(pwd)"

            if [ ! -d .git ]; then
              echo "--- First run: bootstrapping git repository ---"
              git init
              git remote add origin "$REPO_URL"
            fi

            git remote set-url origin "$REPO_URL"

            echo "--- Pulling latest code ---"
            git fetch --depth=1 origin main
            git reset --hard origin/main

            echo "--- Installing dependencies ---"
            if [ -f package-lock.json ]; then
              npm ci --include=dev
            else
              npm install --include=dev
            fi

            echo "--- Building ---"
            npm run build

            echo "--- Restarting app ---"
            if command -v pm2 >/dev/null 2>&1; then
              pm2 restart forksavvyrecipes --update-env \
                || pm2 start npm --name forksavvyrecipes -- run start
              pm2 save
              pm2 list
            else
              echo "ERROR: pm2 not found - the new build is NOT live."
              exit 1
            fi

            echo "Deployment finished."
