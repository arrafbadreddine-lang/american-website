name: Cloudways Auto Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cloudways-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Cloudways Server
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # Build on the runner, not on the server. The Cloudways box cannot
      # reach GitHub any more (GitHub returns 401 to its IP for anonymous
      # git), and its system Node is 18.17.1 - too old for Next 15.
      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --include=dev

      - name: Build
        run: npm run build

      # --delete is destructive; refuse to sync a build that did not produce
      # the standalone server the app actually runs.
      - name: Verify the build
        run: |
          set -euo pipefail
          for required in package.json .next/standalone/server.js .next/standalone/.next/static; do
            if [ ! -e "$required" ]; then
              echo "ERROR: '$required' missing after build - refusing to deploy."
              exit 1
            fi
          done
          echo "Build looks valid."

      - name: Install SSH key
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.CLOUDWAYS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

      - name: Upload build to the server
        run: |
          set -euo pipefail
          # public_html is owned by the application user, not the master user
          # we connect as, so directory times/permissions cannot be set.
          # node_modules is excluded: the standalone build carries its own,
          # and excluding it also protects the copy already on the server.
          rsync -az --delete --omit-dir-times --no-perms \
            --stats --human-readable \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='.gitignore' \
            --exclude='node_modules/' \
            -e "ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new" \
            ./ \
            "${{ secrets.CLOUDWAYS_USER }}@${{ secrets.CLOUDWAYS_HOST }}:${{ vars.CLOUDWAYS_APP_PATH }}/"

      - name: Restart the app
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new \
            "${{ secrets.CLOUDWAYS_USER }}@${{ secrets.CLOUDWAYS_HOST }}" \
            'export PATH="$HOME/.npm-global/bin:$PATH"
             if ! command -v pm2 >/dev/null 2>&1; then
               echo "ERROR: pm2 not found - the new build is NOT live."
               exit 1
             fi
             pm2 restart forksavvyrecipes --update-env
             pm2 save
             pm2 list'

      - name: Remove SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key
